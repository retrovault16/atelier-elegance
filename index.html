  cart=[];save();$("#form-wrap").style.display="none";$("#ok").style.display="block";$("#ok").textContent=T[L].ok;render()};
const showE=(m,err)=>{const e=$("#er");let d="";if(err)d=err.name==="AbortError"?"Délai dépassé / timeout":String(err.message||err).slice(0,220);e.innerHTML=esc(m)+(d?`<br><small style="opacity:.75;word-break:break-word">${esc(d)}</small>`:"");e.style.display="block";e.scrollIntoView({block:"center",behavior:"smooth"})},hideE=()=>{$("#er").style.display="none"};
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cover=p=>p.img[0]||((p.colors.find(c=>c.images&&c.images[0])||{images:[]}).images[0])||"";
const nm=p=>({id:p.id,cat:p.cat,fr:p.fr,ar:p.ar||p.fr,price:+p.price,old:+p.old||0,img:p.img||[],colors:(p.colors||[]).map(c=>({name:c.name,hex:c.hex||"#ccc",images:c.images||[]}))});
async function loadProducts(){
  try{const c=JSON.parse(localStorage.getItem("aep")||"null");if(c&&c.length){PRODUCTS=c;LOADING=false;render()}}catch(e){}
  try{const r=await fetch(CONFIG.supabaseUrl+"/rest/v1/ae_products?select=*&active=eq.true&order=position.asc,created_at.desc",{headers:{apikey:CONFIG.supabaseKey,...(CONFIG.supabaseKey.startsWith("eyJ")?{Authorization:"Bearer "+CONFIG.supabaseKey}:{})}});
    if(!r.ok)throw new Error(await r.text());
    PRODUCTS=(await r.json()).map(p=>nm({id:p.id,cat:p.cat,fr:p.name_fr,ar:p.name_ar,price:p.price,old:p.old_price,img:p.images,colors:p.colors}));
    try{localStorage.setItem("aep",JSON.stringify(PRODUCTS))}catch(e){}}
  catch(e){console.warn(e);if(!PRODUCTS.length)PRODUCTS=SAMPLE.map(nm)}
  LOADING=false;
  cart.forEach(c=>{const p=PRODUCTS.find(x=>x.id===c.id);if(p)c.price=p.price});
  render()}
function addC(p,ci){const c=ci>=0?p.colors[ci]:null,key=p.id+(c?"|"+c.name:""),x=cart.find(z=>(z.key||z.id)===key);
  x?x.qty++:cart.push({key,id:p.id,fr:p.fr,ar:p.ar,price:p.price,qty:1,color:c?c.name:""});render()}
let M=null;
const gal=()=>{const c=M.p.colors[M.ci];return c&&c.images.length?c.images:M.p.img};
function drawM(){const {p,ci,ii}=M,t=T[L],g=gal(),o=p.old>p.price;
  $("#mm").style.background=TINT[p.cat];$("#mm").innerHTML=g[ii]?`<img src="${esc(g[ii])}" alt="">`:ICON[p.cat];
  $("#mt").innerHTML=g.length>1?g.map((u,i)=>`<img src="${esc(u)}" data-t="${i}" class="${i===ii?"on":""}" alt="">`).join(""):"";
  $("#mn").textContent=p[L];
  $("#mp").innerHTML=`<span class="pr">${fmt(p.price)}</span>`+(o?`<s class="old">${fmt(p.old)}</s>`:"");
  $("#mcl").textContent=p.colors.length?t.color:"";
  $("#msw").innerHTML=p.colors.map((c,i)=>`<button data-k="${i}" class="${i===ci?"on":""}"><i style="background:${esc(c.hex)}"></i>${esc(c.name)}</button>`).join("");
  $("#ma").textContent=t.add}
function openM(id,ci){const p=PRODUCTS.find(x=>x.id===id);if(!p)return;M={p,ci:ci<0&&p.colors.length?0:ci,ii:0};drawM();$("#md").classList.add("o")}
const closeM=()=>$("#md").classList.remove("o");
$("#mt").onclick=e=>{const i=e.target.dataset.t;if(i!==undefined){M.ii=+i;drawM()}};
$("#msw").onclick=e=>{const b=e.target.closest("[data-k]");if(b){M.ci=+b.dataset.k;M.ii=0;drawM()}};
$("#ma").onclick=()=>{addC(M.p,M.ci);$("#ma").textContent="✓";setTimeout(closeM,600)};
$("#mx").onclick=closeM;$("#md").onclick=e=>{if(e.target.id==="md")closeM()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
render();loadProducts();
</script></body></html>
