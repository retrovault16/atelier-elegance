<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATELIER & ELEGANCE – Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.76.1/dist/umd/supabase.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f6f0e6;color:#1c1917;margin:0;padding:16px}
input,select,button{padding:10px;border-radius:8px;border:1px solid #d6c7ab;font-size:15px;font-family:inherit}
button{background:#1c1917;color:#f6f0e6;border:0;font-weight:bold;cursor:pointer}
button.sec{background:none;color:#1c1917;border:1px solid #1c1917}
button.dg{background:#c0392b}
button:disabled{opacity:.5;cursor:wait}
#login{max-width:320px;margin:60px auto;display:grid;gap:10px}#app{display:none}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:8px}.tabs button{background:none;color:#1c1917;border:1px solid #1c1917}.tabs button.on{background:#1c1917;color:#f6f0e6}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.stats div{background:#fffaf2;border:1px solid #eadfc9;border-radius:10px;padding:8px 14px}.stats b{color:#b8893b;font-size:20px;display:block}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;background:#fffaf2;font-size:14px}
th{background:#1c1917;color:#f6f0e6}td,th{padding:8px;border-bottom:1px solid #eadfc9;text-align:start;vertical-align:top}td.i{min-width:180px}
select.s-wt{background:#ffeb9c}select.s-ct{background:#ffd8a8}select.s-cf{background:#c6efce}select.s-sh{background:#bdd7ee}select.s-na{background:#e2e2e2}select.s-fo{background:#ffc7ce}select.s-oc{background:#dbeafe}select.s-do{background:#e4c8f0}
/* produits */
#plist{display:grid;gap:10px}
.pc{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fffaf2;border:1px solid #eadfc9;border-radius:12px;padding:10px}
.pc.hid{opacity:.55}
.pc .th{width:64px;height:80px;border-radius:8px;object-fit:cover;background:#ecd3c9;display:grid;place-items:center;font-size:26px}
.pc .pt{flex:1;min-width:160px;display:grid;gap:2px;font-size:14px}.pc .pt small{color:#7a6f63}
.pc .pa{display:flex;gap:6px;flex-wrap:wrap}.pc .pa button{padding:7px 11px;font-size:13px}
s{color:#7a6f63}
#ed{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
#ed .mb{background:#f6f0e6;border-radius:14px;padding:18px;width:min(820px,100%);display:grid;gap:12px}
#ed h2{margin:0}#ed h3{margin:8px 0 0}
#ed label{display:grid;gap:4px;font-size:13px;color:#7a6f63}
#ed label.ck{display:flex;gap:8px;align-items:center;color:#1c1917;font-size:15px}
#ed input[type=checkbox]{width:auto;padding:0}
.g2,.g3{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
.hint{margin:0;font-size:13px;color:#7a6f63}
.ims{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.im{position:relative;width:96px;height:120px;border-radius:8px;overflow:hidden;border:1px solid #d6c7ab;background:#fff;cursor:grab}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.im .mn{position:absolute;top:3px;left:3px;background:#b8893b;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px}
.im .ct{position:absolute;bottom:0;left:0;right:0;display:flex;background:#000a}
.im .ct button{flex:1;padding:5px 0;background:none;color:#fff;border:0;font-size:14px}
.addp{width:96px;height:120px;border:2px dashed #b8893b;border-radius:8px;display:grid;place-items:center;color:#b8893b;font-weight:bold;cursor:pointer;text-align:center;font-size:13px;padding:4px;box-sizing:border-box}
.cb{background:#fffaf2;border:1px solid #eadfc9;border-radius:10px;padding:10px}
.ch{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ch input[type=color]{width:50px;height:42px;padding:2px}.ch input:not([type=color]){flex:1;min-width:140px}
.act{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}#msg{color:#c00}
</style></head><body>
<form id="login"><h2>ATELIER &amp; ELEGANCE<br><small>Admin</small></h2>
<input id="em" type="email" placeholder="Email" autocomplete="username" required>
<input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
<label style="font-size:14px"><input type="checkbox" id="rm" checked style="width:auto"> Rester connecté</label>
<button type="submit">Connexion</button><small id="err" style="color:#c00"></small></form>

<div id="app">
<div class="top"><div class="tabs"><button id="t1" class="on">Commandes</button><button id="t2">Produits</button></div><button id="out" class="sec">Déconnexion</button></div>

<div id="orders">
 <div class="stats" id="stats"></div>
 <div class="bar"><select id="flt"></select><input id="q" placeholder="Rechercher nom / téléphone"><button id="rf">Actualiser</button></div>
 <div class="w"><table><thead><tr><th>Date</th><th>Cliente</th><th>Téléphone</th><th>Wilaya</th><th>Adresse</th><th>Articles</th><th>Livraison</th><th>Total</th><th>Statut</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>

<div id="products" style="display:none">
 <div class="bar"><button id="np">+ Nouveau produit</button><button id="rp" class="sec">Actualiser</button></div>
 <div id="plist"></div>
</div>
</div>

<div id="ed"></div>

<script>
const SUPABASE_URL="https://zztswqpskbmyjqjndnrw.supabase.co",SUPABASE_KEY="sb_publishable_il8iPndibn2vFxjG-hPbxw_nsumgOvp";
const BUCKET="ae-products";
const $=s=>document.querySelector(s);
if(!window.supabase){$("#err").textContent="Bibliothèque non chargée";throw 0}
const store=()=>localStorage.getItem("rm")==="0"?sessionStorage:localStorage;
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:{getItem:k=>store().getItem(k),setItem:(k,v)=>store().setItem(k,v),removeItem:k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)}}}});
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(Number(n)||0).toLocaleString("fr-FR")+" DA";

/* ================= COMMANDES ================= */
const STATUS={"Waiting":["En attente","wt"],"Contacted":["Numéro contacté","ct"],"Confirmed":["Confirmé","cf"],"Shipping":["En livraison","sh"],"No answer":["Client ne répond pas","na"],"False order":["Fausse commande","fo"],"On check":["Vérification","oc"],"Double order":["Commande double","do"]};
const ACTIVE=["Waiting","Contacted","Confirmed","Shipping","No answer","False order"];
const lab=s=>(STATUS[s]||[s])[0],cls=s=>"s-"+((STATUS[s]||[0,"x"])[1]);
let ORD=[];
async function load(){
  const {data,error}=await sb.from("ae_orders").select("*").order("created_at",{ascending:false}).limit(1000);
  if(error){alert(error.message);return}
  ORD=data;
  const cur=$("#flt").value,extra=[...new Set(ORD.map(o=>o.status))].filter(s=>s&&!ACTIVE.includes(s));
  $("#flt").innerHTML=`<option value="">Tous les statuts</option>`+[...ACTIVE,...extra].map(s=>`<option value="${esc(s)}">${esc(lab(s))}</option>`).join("");
  $("#flt").value=cur;
  drawS();drawO();
}
function drawS(){
  const n=s=>ORD.filter(o=>o.status===s).length;
  $("#stats").innerHTML=`<div><b>${ORD.length}</b>commandes</div><div><b>${n("Waiting")}</b>en attente</div><div><b>${n("Shipping")}</b>en livraison</div><div><b>${fmt(ORD.filter(o=>o.status==="Confirmed").reduce((s,o)=>s+(o.total||0),0))}</b>confirmé</div>`;
}
function drawO(){
  const f=$("#flt").value,q=$("#q").value.trim().toLowerCase();
  const list=ORD.filter(o=>(!f||o.status===f)&&(!q||(o.name||"").toLowerCase().includes(q)||(o.phone||"").includes(q)));
  $("#rows").innerHTML=list.map(o=>{const opts=ACTIVE.includes(o.status)?ACTIVE:[...ACTIVE,o.status];
  return `<tr><td>${new Date(o.created_at).toLocaleString("fr-DZ")}</td><td>${esc(o.name)}</td><td><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></td><td>${esc(o.wilaya)}</td><td>${esc(o.address)}</td>
  <td class="i">${(o.items||[]).map(i=>esc(i.name)+" × "+esc(i.qty)).join("<br>")}</td><td>${esc(o.delivery)}<br>${fmt(o.delivery_price)}</td><td><b>${fmt(o.total)}</b></td>
  <td><select class="${cls(o.status)}" data-id="${esc(o.id)}">${opts.map(s=>`<option value="${esc(s)}" ${s===o.status?"selected":""}>${esc(lab(s))}</option>`).join("")}</select></td></tr>`}).join("")||`<tr><td colspan="9">Aucune commande.</td></tr>`;
}
$("#rows").onchange=async e=>{const s=e.target;if(!s.dataset.id)return;
  const {error}=await sb.from("ae_orders").update({status:s.value}).eq("id",s.dataset.id);
  if(error){alert(error.message+(/check|enum|constraint/i.test(error.message)?"\n\nExécutez l'étape « statuts » du fichier supabase-setup.sql.":""));drawO();return}
  const o=ORD.find(x=>String(x.id)===s.dataset.id);if(o)o.status=s.value;s.className=cls(s.value);drawS()};
$("#flt").onchange=drawO;$("#q").oninput=drawO;$("#rf").onclick=load;

/* ================= PRODUITS ================= */
const CATS={watches:"Montres",rings:"Bagues",earrings:"Boucles d'oreilles",hats:"Chapeaux"};
const SAMPLE=[["w1","watches","Montre Rose Gold","ساعة روز جولد",5900],["w2","watches","Montre Classique Cuir","ساعة كلاسيك جلد",4900],["r1","rings","Bague Solitaire","خاتم سوليتير",1900],["r2","rings","Bague Dorée Fine","خاتم ذهبي رفيع",1500],["e1","earrings","Boucles Perles","أقراط لؤلؤ",1700],["e2","earrings","Boucles Créoles","أقراط دائرية",1400],["h1","hats","Chapeau Paille Chic","قبعة قش أنيقة",2200],["h2","hats","Capeline Élégante","قبعة كابلين",2600]];
let PR=[],ed=null;
const urlsOf=p=>[...(p.images||[]),...(p.colors||[]).flatMap(c=>c.images||[])];
const pathOf=u=>{const i=u.indexOf("/"+BUCKET+"/");return i<0?null:decodeURIComponent(u.slice(i+BUCKET.length+2).split("?")[0])};
const rmFiles=async urls=>{const p=urls.map(pathOf).filter(Boolean);if(p.length)try{await sb.storage.from(BUCKET).remove(p)}catch(e){console.warn(e)}};

async function loadP(){
  const {data,error}=await sb.from("ae_products").select("*").order("position").order("created_at",{ascending:false});
  if(error){$("#plist").innerHTML=`<p style="color:#c00">${esc(error.message)}<br>Avez-vous exécuté le fichier supabase-setup.sql dans Supabase ?</p>`;return}
  PR=data;renderP();
}
function renderP(){
  if(!PR.length){$("#plist").innerHTML=`<p>Aucun produit pour l'instant.</p><button id="imp" class="sec">Importer les 8 produits d'exemple</button>`;return}
  $("#plist").innerHTML=PR.map(p=>{const im=(p.images&&p.images[0])||((p.colors||[]).find(c=>c.images&&c.images[0])||{images:[]}).images[0];
  return `<div class="pc ${p.active?"":"hid"}">${im?`<img class="th" src="${esc(im)}" alt="">`:`<div class="th">🖼</div>`}
  <div class="pt"><b>${esc(p.name_fr)}</b><small>${esc(CATS[p.cat]||p.cat)}${p.active?"":" · MASQUÉ"}</small>
  <span><b>${fmt(p.price)}</b> ${p.old_price?`<s>${fmt(p.old_price)}</s>`:""}</span><small>${(p.images||[]).length} photo(s) · ${(p.colors||[]).length} couleur(s)</small></div>
  <div class="pa" data-id="${esc(p.id)}"><button data-a="up" class="sec">▲</button><button data-a="dn" class="sec">▼</button><button data-a="ed">Modifier</button><button data-a="tg" class="sec">${p.active?"Masquer":"Afficher"}</button><button data-a="del" class="dg">Supprimer</button></div></div>`}).join("");
}
$("#plist").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
  if(b.id==="imp"){const {error}=await sb.from("ae_products").insert(SAMPLE.map((s,i)=>({id:s[0],cat:s[1],name_fr:s[2],name_ar:s[3],price:s[4],position:i})));if(error)alert(error.message);loadP();return}
  const id=b.parentElement.dataset.id,a=b.dataset.a,p=PR.find(x=>x.id===id);if(!p)return;
  if(a==="ed")openEd(id);
  else if(a==="up"||a==="dn")mv(id,a==="up"?-1:1);
  else if(a==="tg"){const {error}=await sb.from("ae_products").update({active:!p.active}).eq("id",id);if(error)alert(error.message);loadP()}
  else if(a==="del"&&confirm("Supprimer « "+p.name_fr+" » et ses photos ?")){await rmFiles(urlsOf(p));const {error}=await sb.from("ae_products").delete().eq("id",id);if(error)alert(error.message);loadP()}
};
async function mv(id,d){
  const i=PR.findIndex(p=>p.id===id),j=i+d;if(j<0||j>=PR.length)return;
  const old=Object.fromEntries(PR.map(p=>[p.id,p.position]));
  [PR[i],PR[j]]=[PR[j],PR[i]];PR.forEach((p,k)=>p.position=k);renderP();
  const res=await Promise.all(PR.filter(p=>old[p.id]!==p.position).map(p=>sb.from("ae_products").update({position:p.position}).eq("id",p.id)));
  const er=res.find(r=>r.error);if(er){alert(er.error.message);loadP()}
}

/* --- éditeur --- */
const A=s=>s==="g"?ed.images:ed.colors[+s].images;
const msg=t=>{const m=$("#msg");if(m)m.textContent=t||""};
function imgs(list,s){
  return `<div class="ims" data-s="${s}">`+list.map((u,i)=>`<div class="im" draggable="true" data-i="${i}"><img src="${esc(u)}" alt="">${i===0&&s==="g"?'<span class="mn">Principale</span>':""}<div class="ct"><button type="button" data-act="L" data-i="${i}">◀</button><button type="button" data-act="R" data-i="${i}">▶</button><button type="button" data-act="X" data-i="${i}">✕</button></div></div>`).join("")+
  `<label class="addp">+ Ajouter<br>des photos<input type="file" accept="image/*" multiple hidden></label></div>`;
}
const drawPh=()=>$("#ph").innerHTML=imgs(ed.images,"g");
const drawCl=()=>$("#cl").innerHTML=ed.colors.map((c,i)=>`<div class="cb"><div class="ch"><input type="color" data-ci="${i}" data-k="hex" value="${esc(c.hex)}"><input data-ci="${i}" data-k="name" placeholder="Nom de la couleur (ex : Rose Gold)" value="${esc(c.name)}"><button type="button" class="dg" data-act="DC" data-ci="${i}">Supprimer</button></div>${imgs(c.images,String(i))}</div>`).join("")||`<p class="hint">Aucune couleur ajoutée.</p>`;
const redraw=s=>s==="g"?drawPh():drawCl();

function openEd(id){
  const p=id?JSON.parse(JSON.stringify(PR.find(x=>x.id===id))):null;
  ed={id:p?p.id:"p"+Date.now().toString(36),isNew:!p,cat:p?p.cat:"watches",name_fr:p?p.name_fr:"",name_ar:p&&p.name_ar||"",price:p?p.price:"",old_price:p&&p.old_price||"",active:p?p.active:true,
      images:p?p.images||[]:[],colors:(p?p.colors||[]:[]).map(c=>({name:c.name,hex:c.hex||"#c9a24a",images:c.images||[]})),up:[],orig:p?urlsOf(p):[]};
  $("#ed").innerHTML=`<div class="mb"><h2>${ed.isNew?"Nouveau produit":"Modifier le produit"}</h2>
  <div class="g2"><label>Nom (français)<input id="f_fr" value="${esc(ed.name_fr)}"></label><label>Nom (arabe) – optionnel<input id="f_ar" dir="rtl" value="${esc(ed.name_ar)}"></label></div>
  <div class="g3"><label>Catégorie<select id="f_cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===ed.cat?"selected":""}>${v}</option>`).join("")}</select></label>
  <label>Prix actuel (DA)<input id="f_pr" type="number" min="0" inputmode="numeric" value="${esc(ed.price)}"></label>
  <label>Ancien prix barré (DA) – optionnel<input id="f_old" type="number" min="0" inputmode="numeric" value="${esc(ed.old_price)}"></label></div>
  <label class="ck"><input type="checkbox" id="f_act" ${ed.active?"checked":""}> Visible sur le site</label>
  <h3>Photos du produit</h3><p class="hint">La 1ʳᵉ photo est celle affichée dans la boutique. Changez l'ordre avec ◀ ▶ ou en glissant une photo.</p><div id="ph"></div>
  <h3>Couleurs</h3><p class="hint">Chaque couleur peut avoir ses propres photos. Le client choisit la couleur sur le site.</p><div id="cl"></div>
  <div><button type="button" class="sec" id="addc">+ Ajouter une couleur</button></div>
  <div class="act"><button id="sv">Enregistrer</button><button class="sec" id="cn">Annuler</button><span id="msg"></span></div></div>`;
  $("#ed").style.display="flex";drawPh();drawCl();
}
const closeEd=()=>{$("#ed").style.display="none";$("#ed").innerHTML="";ed=null};
$("#np").onclick=()=>openEd(null);$("#rp").onclick=loadP;

function field(e){const t=e.target;if(!ed)return;
  if(t.id==="f_fr")ed.name_fr=t.value;else if(t.id==="f_ar")ed.name_ar=t.value;else if(t.id==="f_cat")ed.cat=t.value;
  else if(t.id==="f_pr")ed.price=t.value;else if(t.id==="f_old")ed.old_price=t.value;else if(t.id==="f_act")ed.active=t.checked;
  else if(t.dataset.ci!==undefined&&t.dataset.k)ed.colors[+t.dataset.ci][t.dataset.k]=t.value}
$("#ed").addEventListener("input",field);$("#ed").addEventListener("change",field);

$("#ed").addEventListener("click",async e=>{
  if(e.target.id==="addc"){ed.colors.push({name:"",hex:"#c9a24a",images:[]});drawCl();return}
  if(e.target.id==="cn"){if(ed.up.length)await rmFiles(ed.up);closeEd();return}
  if(e.target.id==="sv"){save();return}
  const b=e.target.closest("button[data-act]");if(!b)return;
  if(b.dataset.act==="DC"){ed.colors.splice(+b.dataset.ci,1);drawCl();return}
  const s=b.closest("[data-s]").dataset.s,arr=A(s),i=+b.dataset.i;
  if(b.dataset.act==="L"&&i>0)[arr[i-1],arr[i]]=[arr[i],arr[i-1]];
  else if(b.dataset.act==="R"&&i<arr.length-1)[arr[i+1],arr[i]]=[arr[i],arr[i+1]];
  else if(b.dataset.act==="X")arr.splice(i,1);
  redraw(s);
});
let dg=null;
$("#ed").addEventListener("dragstart",e=>{const t=e.target.closest&&e.target.closest(".im");if(!t)return;dg={s:t.closest("[data-s]").dataset.s,i:+t.dataset.i};e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain","x")}catch(_){}});
$("#ed").addEventListener("dragover",e=>{if(dg&&e.target.closest(".im"))e.preventDefault()});
$("#ed").addEventListener("drop",e=>{const t=e.target.closest(".im");if(!dg||!t)return;e.preventDefault();
  const s=t.closest("[data-s]").dataset.s;if(s!==dg.s){dg=null;return}
  const arr=A(s);arr.splice(+t.dataset.i,0,arr.splice(dg.i,1)[0]);dg=null;redraw(s)});

async function shrink(file){
  try{const bmp=await createImageBitmap(file),k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.88))}catch(e){return file}
}
async function up(file){
  const blob=await shrink(file),ext=blob.type==="image/jpeg"?"jpg":(file.name.split(".").pop()||"jpg").toLowerCase();
  const path=`${ed.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:blob.type||"image/jpeg",cacheControl:"31536000"});
  if(error)throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
$("#ed").addEventListener("change",async e=>{const f=e.target;if(f.type!=="file"||!ed)return;
  const s=f.closest("[data-s]").dataset.s,files=[...f.files];f.value="";if(!files.length)return;
  try{for(let k=0;k<files.length;k++){msg(`Envoi de la photo ${k+1}/${files.length}…`);const u=await up(files[k]);A(s).push(u);ed.up.push(u);redraw(s)}msg("")}
  catch(err){msg("Erreur d'envoi : "+(err.message||err))}
});

async function save(){
  const name=ed.name_fr.trim(),price=Number(ed.price),old=ed.old_price===""?null:Number(ed.old_price);
  if(!name)return msg("Entrez le nom du produit.");
  if(!(price>0))return msg("Entrez un prix actuel valide.");
  if(old!==null&&!(old>price))return msg("L'ancien prix doit être supérieur au prix actuel.");
  if(ed.colors.some(c=>!c.name.trim()))return msg("Donnez un nom à chaque couleur.");
  const row={cat:ed.cat,name_fr:name,name_ar:ed.name_ar.trim()||null,price,old_price:old,images:ed.images,colors:ed.colors.map(c=>({name:c.name.trim(),hex:c.hex,images:c.images})),active:ed.active};
  const b=$("#sv");b.disabled=true;msg("Enregistrement…");
  let error;
  if(ed.isNew){row.id=ed.id;row.position=Math.min(0,...PR.map(p=>p.position||0))-1;({error}=await sb.from("ae_products").insert(row))}
  else({error}=await sb.from("ae_products").update(row).eq("id",ed.id));
  if(error){b.disabled=false;msg(error.message);return}
  const keep=new Set(urlsOf(row));await rmFiles([...ed.orig,...ed.up].filter(u=>!keep.has(u)));
  closeEd();loadP();
}

/* ================= NAVIGATION / LOGIN ================= */
function tab(n){$("#orders").style.display=n===1?"block":"none";$("#products").style.display=n===2?"block":"none";$("#t1").classList.toggle("on",n===1);$("#t2").classList.toggle("on",n===2);if(n===2&&!PR.length)loadP()}
$("#t1").onclick=()=>tab(1);$("#t2").onclick=()=>tab(2);
async function show(){const {data}=await sb.auth.getSession();const ok=!!data.session;$("#login").style.display=ok?"none":"grid";$("#app").style.display=ok?"block":"none";if(ok)load()}
$("#login").onsubmit=async e=>{e.preventDefault();localStorage.setItem("rm",$("#rm").checked?"1":"0");const {error}=await sb.auth.signInWithPassword({email:$("#em").value,password:$("#pw").value});if(error)$("#err").textContent=error.message;else show()};
$("#out").onclick=async()=>{await sb.auth.signOut();show()};show();
</script></body></html>
